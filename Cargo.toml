[package]
name = "trackpad"
version = "0.1.0"
edition = "2024"

[[bin]]
harness = false
name = "trackpad"

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.7"
defmt = "1.2.0"
defmt-rtt = "1.3.1"
panic-probe = { version = "0.3", features = ["print-defmt"] }
